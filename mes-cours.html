<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="shortcut icon" href="images/logo2.jpg" type="image/x-icon">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <!-- Flowbite CSS -->
    <link href="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css"/>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen">

  <!-- 📱 Barre supérieure pour mobile uniquement -->
  <div class="md:hidden flex items-center justify-between p-4 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 sticky top-0 z-40">
    <h2 class="text-xl font-bold text-gray-900 dark:text-white">Dashboard</h2>
    <button id="open-sidebar-btn" class="p-2 text-gray-600 rounded-lg hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-gray-700">
      <i class="fa-solid fa-bars text-xl"></i>
    </button>
  </div>

  <div class="flex">

    <!-- 🚪 Voile d'ombrage mobile (cliquer à côté pour fermer le menu) -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-gray-900/50 z-40 hidden md:hidden"></div>

    
    <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-white border-r border-gray-200 dark:bg-gray-800 dark:border-gray-700 transform -translate-x-full transition-transform duration-300 ease-in-out z-50 md:translate-x-0 md:static md:h-screen">
      
      <div class="p-6 flex justify-between items-center">
        <h2 class="text-2xl font-bold text-gray-900 dark:text-white">
          Dashboard
        </h2>
        
        <button id="close-sidebar-btn" class="md:hidden text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-white">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>

      <nav class="px-4 space-y-2">
        <a href="#" class="flex items-center p-3 text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l9-9 9 9M5 10v10h14V10"/>
          </svg>
          <span class="ml-3">Accueil</span>
        </a>

        <a href="mescoursDashboard.html" class="flex items-center p-3 rounded-lg text-gray-900 dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5A4.5 4.5 0 003 9.5v9A4.5 4.5 0 017.5 14c1.746 0 3.332.477 4.5 1.253m0-9C13.168 5.477 14.754 5 16.5 5A4.5 4.5 0 0121 9.5v9a4.5 4.5 0 00-4.5-4.5c-1.746 0-3.332.477-4.5 1.253"/>
          </svg>
          <span class="ml-3">Mes cours</span>
        </a>

        <a href="#" class="flex items-center p-3 rounded-lg text-gray-900 dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <span class="ml-3">Historique</span>
        </a>

        <a href="mon-profile.html" class="flex items-center p-3 rounded-lg text-gray-900 dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A3 3 0 017 12h10a3 3 0 011.879 5.804M15 10a3 3 0 10-6 0"/>
          </svg>
          <span class="ml-3">Mon profil</span>
        </a>
      </nav>

    </aside>

    <!-- 🏙️ Contenu Principal -->
    <main class="flex-1 p-4 sm:p-6 md:p-8 w-full overflow-x-hidden">

      <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 dark:text-white" id="saluer">
        Bonjour 
      </h1>

      <p class="mt-1 text-sm sm:text-base text-gray-500 dark:text-gray-400">
        Continuez votre apprentissage.
      </p>

      <!-- 📊 Cartes Statistiques (1 col sur mobile, 2 sur tablette, 3 sur desktop) -->
      <div class="grid grid-cols-1 gap-4 sm:gap-6 mt-6 sm:mt-8 sm:grid-cols-2 md:grid-cols-3">

        <div class="p-5 sm:p-6 bg-white border border-gray-200 rounded-xl shadow-sm dark:bg-gray-800 dark:border-gray-700">
          <p class="text-sm font-medium text-gray-500 dark:text-gray-400">
            Cours suivis
          </p>
          <h2 class="mt-2 text-2xl sm:text-3xl font-bold text-gray-900 dark:text-white">
            12
          </h2>
        </div>

        <div class="p-5 sm:p-6 bg-white border border-gray-200 rounded-xl shadow-sm dark:bg-gray-800 dark:border-gray-700">
          <p class="text-sm font-medium text-gray-500 dark:text-gray-400">
            Cours terminés
          </p>
          <h2 class="mt-2 text-2xl sm:text-3xl font-bold text-green-600">
            8
          </h2>
        </div>

        <div class="p-5 sm:p-6 bg-white border border-gray-200 rounded-xl shadow-sm dark:bg-gray-800 dark:border-gray-700 sm:col-span-2 md:col-span-1">
          <p class="text-sm font-medium text-gray-500 dark:text-gray-400">
            Progression
          </p>
          <div class="w-full h-3 mt-4 bg-gray-200 rounded-full dark:bg-gray-700">
            <div class="h-3 bg-blue-600 rounded-full" style="width:70%"></div>
          </div>
          <p class="mt-2 text-xs sm:text-sm text-gray-500 dark:text-gray-400">
            70%
          </p>
        </div>

      </div>

      <!-- 📚 Derniers cours (Empilement vertical sur mobile pour éviter les chevauchements) -->
      <div class="p-5 sm:p-6 mt-6 sm:mt-8 bg-white border border-gray-200 rounded-xl shadow-sm dark:bg-gray-800 dark:border-gray-700">
        <h2 class="mb-4 sm:mb-6 text-lg sm:text-xl font-semibold text-gray-900 dark:text-white">
          Derniers cours consultés
        </h2>

        <div class="space-y-4">

          <div class="flex flex-col sm:flex-row sm:items-center justify-between p-3 sm:p-0 bg-gray-50 sm:bg-transparent dark:bg-gray-700/40 sm:dark:bg-transparent rounded-lg gap-3">
            <div>
              <h3 class="font-semibold text-sm sm:text-base text-gray-900 dark:text-white">
                Développement Web
              </h3>
              <p class="text-xs sm:text-sm text-gray-500 dark:text-gray-400">
                Consulté aujourd'hui
              </p>
            </div>
            <button class="w-full sm:w-auto px-4 py-2 text-sm text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition">
              Continuer
            </button>
          </div>

          <div class="flex flex-col sm:flex-row sm:items-center justify-between p-3 sm:p-0 bg-gray-50 sm:bg-transparent dark:bg-gray-700/40 sm:dark:bg-transparent rounded-lg gap-3">
            <div>
              <h3 class="font-semibold text-sm sm:text-base text-gray-900 dark:text-white">
                JavaScript
              </h3>
              <p class="text-xs sm:text-sm text-gray-500 dark:text-gray-400">
                Consulté hier
              </p>
            </div>
            <button class="w-full sm:w-auto px-4 py-2 text-sm text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition">
              Continuer
            </button>
          </div>

        </div>

      </div>
    </main>

  </div>

  <script src="mescours.js"></script>

  <!-- 🕹️ Script pour ouvrir/fermer le menu mobile -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const openBtn = document.getElementById("open-sidebar-btn");
      const closeBtn = document.getElementById("close-sidebar-btn");
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("sidebar-overlay");

      function openMenu() {
        sidebar.classList.remove("-translate-x-full");
        overlay.classList.remove("hidden");
      }

      function closeMenu() {
        sidebar.classList.add("-translate-x-full");
        overlay.classList.add("hidden");
      }

      openBtn.addEventListener("click", openMenu);
      closeBtn.addEventListener("click", closeMenu);
      overlay.addEventListener("click", closeMenu);
    });

    let token = localStorage.getItem("token")
    let saluer = document.getElementById("saluer")

    saluer.textContent += localStorage.getItem("nom");
  </script>
</body>
</html>
