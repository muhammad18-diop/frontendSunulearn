<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Profil</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>

    <link href="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.css" rel="stylesheet">
</head>

<body class="bg-gray-100 dark:bg-gray-900">

<div class="flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md bg-white dark:bg-gray-800 rounded-2xl shadow-lg p-6">

        <div class="flex flex-col items-center">

            <img
                id="avatar"
                class="w-24 h-24 rounded-full object-cover"
                src="https://i.pravatar.cc/150"
                alt="Avatar">

            <h2
                id="name"
                class="mt-4 text-xl font-bold text-gray-900 dark:text-white">
                Chargement...
            </h2>

            <p
                id="role"
                class="text-gray-500 dark:text-gray-400">
                Utilisateur
            </p>

        </div>

        <div class="mt-6">

            <div class="p-3 bg-gray-50 dark:bg-gray-700 rounded-lg">
                <p class="text-xs text-gray-500 dark:text-gray-400">
                    Email
                </p>

                <p
                    id="email"
                    class="font-medium text-gray-900 dark:text-white">
                    Chargement...
                </p>
            </div>

        </div>

        <div class="mt-6 flex gap-3">

            <button
                data-modal-target="editProfileModal"
                data-modal-toggle="editProfileModal"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg">
                Modifier
            </button>

            <button
                id="logout"
                class="w-full bg-red-600 hover:bg-red-700 text-white py-2 rounded-lg">
                Déconnexion
            </button>

        </div>

    </div>

</div>

<!-- MODAL -->

<div id="editProfileModal"
     tabindex="-1"
     aria-hidden="true"
     class="hidden fixed top-0 left-0 right-0 z-50 w-full p-4 overflow-y-auto md:inset-0 h-full">

    <div class="relative w-full max-w-md mx-auto">

        <div class="relative bg-white dark:bg-gray-800 rounded-lg shadow">

            <div class="flex items-center justify-between p-4 border-b dark:border-gray-700">

                <h3 class="text-lg font-semibold text-gray-900 dark:text-white">
                    Modifier le profil
                </h3>

                <button
                    type="button"
                    class="text-gray-400"
                    data-modal-hide="editProfileModal">
                    ✕
                </button>

            </div>

            <form id="editForm" class="p-6 space-y-4">

                <div>
                    <label class="block mb-2 text-sm text-gray-900 dark:text-white">
                        Nom
                    </label>

                    <input
                        id="editName"
                        type="text"
                        class="w-full p-2 border rounded-lg dark:bg-gray-700 dark:text-white">
                </div>

                <div>
                    <label class="block mb-2 text-sm text-gray-900 dark:text-white">
                        Email
                    </label>

                    <input
                        id="editEmail"
                        type="email"
                        class="w-full p-2 border rounded-lg dark:bg-gray-700 dark:text-white">
                </div>

                <div>
                    <label class="block mb-2 text-sm text-gray-900 dark:text-white">
                        Avatar URL
                    </label>

                    <input
                        id="editAvatar"
                        type="text"class="w-full p-2 border rounded-lg dark:bg-gray-700 dark:text-white">

                </div>

                <button

                    type="submit"

                    class="w-full bg-blue-600 text-white py-2 rounded-lg">

                    Sauvegarder

                </button>

            </form>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.js"></script>

<script src="profile.js"></script>

</body>
</html>
