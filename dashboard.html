<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Animate CSS -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <!-- Flowbite -->
    <link href="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.css" rel="stylesheet"/>

    <!-- AOS -->
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css"/>
</head>

<body>

<div class="min-h-screen bg-gray-100">

    
    <aside class="fixed top-0 left-0 w-64 h-screen bg-white shadow-lg">

        <div class="p-6 border-b">
            <h1 class="text-2xl font-bold text-indigo-600">
                Admin Panel
            </h1>
        </div>

        <nav class="mt-6 space-y-1">

            
            <a href="dashboard.html"
               class="flex items-center gap-3 px-6 py-3 text-gray-700 hover:bg-indigo-50 hover:text-indigo-600">

                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M3 13h4v7H3v-7zm6-10h4v17H9V3zm6 6h4v11h-4V9z"/>
                </svg>

                Dashboard
            </a>

            
            <a href="usersDashboard.html"
               class="flex items-center gap-3 px-6 py-3 text-gray-700 hover:bg-indigo-50 hover:text-indigo-600">

                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M10 10a4 4 0 100-8 4 4 0 000 8zm-7 9a7 7 0 0114 0H3z"/>
                </svg>

                Utilisateurs
            </a>

            
            <a href="coursDashboard.html"
               class="flex items-center gap-3 px-6 py-3 text-gray-700 hover:bg-indigo-50 hover:text-indigo-600">

                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M4 4a2 2 0 012-2h10v16H6a2 2 0 01-2-2V4z"/>
                </svg>

                Cours
            </a>

            
            <a href="#"
               class="flex items-center gap-3 px-6 py-3 text-gray-700 hover:bg-indigo-50 hover:text-indigo-600">

                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M18 13V5a2 2 0 00-2-2H4a2 2 0 00-2 2v8a2 2 0 002 2h12a2 2 0 002-2zM6 7h8v2H6V7z"/>
                </svg>

                Quiz
            </a>

            
            <a href="#"
               class="flex items-center gap-3 px-6 py-3 text-gray-700 hover:bg-indigo-50 hover:text-indigo-600">

                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M4 4h12a2 2 0 012 2v2H2V6a2 2 0 012-2z"/>
                    <path d="M2 10h16v6a2 2 0 01-2 2H4a2 2 0 01-2-2v-6z"/>
                </svg>

                Paiements
            </a>

            
            <a href="#"
               class="flex items-center gap-3 px-6 py-3 text-red-500 hover:bg-red-50">

                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M3 10a1 1 0 011-1h7V7l5 3-5 3v-2H4a1 1 0 01-1-1z"/>
                </svg>

                Déconnexion
            </a>

        </nav>
    </aside>

    
    <main class="ml-64 p-8">

        <h2 class="text-3xl font-bold mb-8">
            Tableau de bord
        </h2>

        
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">

            <div class="bg-white p-6 rounded-2xl shadow">
                <p class="text-gray-500">Utilisateurs</p>
                <h3 class="text-3xl font-bold mt-2" id="totalUsers">0</h3></div>

            <div class="bg-white p-6 rounded-2xl shadow">
                <p class="text-gray-500">Utilisateurs actifs</p>
                <h3 class="text-3xl font-bold mt-2" id="activeUsers">0</h3>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow">
                <p class="text-gray-500">Cours publiés</p>
                <h3 class="text-3xl font-bold mt-2" id="nombreCours">0</h3>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow">
                <p class="text-gray-500">Revenus</p>
                <h3 class="text-3xl font-bold mt-2">15250 FCFA</h3>
            </div>

        </div>

        
        <div class="bg-white rounded-xl shadow-md overflow-hidden mt-8">

            <div class="p-4 border-b flex justify-between items-center">
                <h2 class="text-xl font-bold">Derniers cours</h2>

                <span id="nombreCours"
                      class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-sm font-semibold">
                    0 cours
                </span>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left">
                    <thead class="bg-gray-100">
                    <tr>
                        <th class="px-6 py-3">Titre</th>
                        <th class="px-6 py-3">Catégorie</th>
                        <th class="px-6 py-3">PDF</th>
                        <th class="px-6 py-3 text-center">Actions</th>
                    </tr>
                    </thead>

                    <tbody id="tableCours"></tbody>
                </table>
            </div>

            <div id="pagination" class="flex justify-center gap-2 p-4">
                
            </div>

        </div>

    </main>

</div>

<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.js"></script>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script src="dashboard.js"></script>

<script>
    AOS.init();
</script>

</body>
</html>
