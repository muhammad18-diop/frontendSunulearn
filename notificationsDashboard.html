<!DOCTYPE html>
<!-- AJOUT : La classe 'dark' force le mode sombre global de Tailwind et Flowbite -->
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Utilisateurs - Admin Panel</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- AJOUT : Configuration requise pour activer le mode sombre basé sur la classe 'dark' -->
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    
    <!-- Flowbite CSS -->
    <link href="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css"/>
</head>

<!-- MODIFICATION : Couleur de fond de page et de texte adaptative -->
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white transition-colors duration-200">

<div class="min-h-screen">

    <!-- SIDEBAR : Arrière-plan, bordures et états de survol adaptés au mode sombre -->
    <aside class="fixed top-0 left-0 w-64 h-screen bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 shadow-lg">

        <div class="p-6 border-b border-gray-200 dark:border-gray-700">
            <h1 class="text-2xl font-bold text-indigo-600 dark:text-indigo-400">
                Admin Panel
            </h1>
        </div>

        <nav class="mt-6 space-y-1">
            <a href="dashboard.html"
               class="flex items-center gap-3 px-6 py-3 text-gray-700 dark:text-gray-300 hover:bg-indigo-50 dark:hover:bg-gray-700 hover:text-indigo-600 dark:hover:text-indigo-400">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M3 13h4v7H3v-7zm6-10h4v17H9V3zm6 6h4v11h-4V9z"/>
                </svg>
                Dashboard
            </a>

            <!-- Users -->
            <a href="usersDashboard.html"
               class="flex items-center gap-3 px-6 py-3 text-gray-700 dark:text-gray-300 hover:bg-indigo-50 dark:hover:bg-gray-700 hover:text-indigo-600 dark:hover:text-indigo-400">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M10 10a4 4 0 100-8 4 4 0 000 8zm-7 9a7 7 0 0114 0H3z"/>
                </svg>
                Utilisateurs
            </a>

            <!-- Cours -->
            <a href="coursDashboard.html"
               class="flex items-center gap-3 px-6 py-3 text-gray-700 dark:text-gray-300 hover:bg-indigo-50 dark:hover:bg-gray-700 hover:text-indigo-600 dark:hover:text-indigo-400">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M4 4a2 2 0 012-2h10v16H6a2 2 0 01-2-2V4z"/>
                </svg>
                Cours
            </a>

             <a href="#"
               class="flex items-center gap-3 px-6 py-3 text-gray-700 dark:text-gray-300 hover:bg-indigo-50 dark:hover:bg-gray-700 hover:text-indigo-600 dark:hover:text-indigo-400">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M18 13V5a2 2 0 00-2-2H4a2 2 0 00-2 2v8a2 2 0 002 2h12a2 2 0 002-2zM6 7h8v2H6V7z"/>
                </svg>
                Notifications
            </a>

            <a href="#"
               class="flex items-center gap-3 px-6 py-3 text-gray-700 dark:text-gray-300 hover:bg-indigo-50 dark:hover:bg-gray-700 hover:text-indigo-600 dark:hover:text-indigo-400">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M18 13V5a2 2 0 00-2-2H4a2 2 0 00-2 2v8a2 2 0 002 2h12a2 2 0 002-2zM6 7h8v2H6V7z"/>
                </svg>
                Quiz
            </a>

            <a href="#"
               class="flex items-center gap-3 px-6 py-3 text-gray-700 dark:text-gray-300 hover:bg-indigo-50 dark:hover:bg-gray-700 hover:text-indigo-600 dark:hover:text-indigo-400">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M4 4h12a2 2 0 012 2v2H2V6a2 2 0 012-2z"/>
                    <path d="M2 10h16v6a2 2 0 01-2 2H4a2 2 0 01-2-2v-6z"/>
                </svg>
                Paiements
            </a>

            <a href="#"
               class="flex items-center gap-3 px-6 py-3 text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M3 10a1 1 0 011-1h7V7l5 3-5 3v-2H4a1 1 0 01-1-1z"/>
                </svg>
                Déconnexion
            </a>
        </nav>
    </aside>

    <main class="ml-64 p-6">
    <div class="max-w-3xl mx-auto bg-white dark:bg-gray-800 rounded-xl shadow-md p-6">

        <div class="mb-6">
            <h1 class="text-2xl font-bold text-gray-900 dark:text-white">
                Envoyer une notification
            </h1>
            <p class="text-gray-500 dark:text-gray-400 mt-1">
                Envoyez un email à tous les utilisateurs de la plateforme.
            </p>
        </div>

        <form id="notificationForm" class="space-y-6">

            <div>
                <label for="subject"
                       class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                    Objet
                </label>
                <input
                    type="text"
                    id="subject"
                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block w-full p-3 dark:bg-gray-700 dark:border-gray-600 dark:text-white"
                    placeholder="Entrez l'objet du message"
                    required>
            </div>

            <div>
                <label for="message"
                       class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                    Message
                </label>
                <textarea
                    id="message"
                    rows="8"
                    class="block w-full p-3 text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-indigo-500 focus:border-indigo-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white"
                    placeholder="Rédigez votre message ici..."
                    required></textarea>
            </div>

            <button
                type="submit"
                class="w-full md:w-auto text-white bg-indigo-600 hover:bg-indigo-700 focus:ring-4 focus:ring-indigo-300 font-medium rounded-lg text-sm px-6 py-3 dark:bg-indigo-500 dark:hover:bg-indigo-600">
                Envoyer à tous les utilisateurs
            </button>

        </form>

        <div
            id="result"
            class="hidden mt-6 p-4 rounded-lg text-sm">
        </div>

    </div>
</main>

<div id="result"></div>
<script src="notificationsDashboard.js"></script>

</body>
</html>
